name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy upstream image
        env:
          TARGET: ghcr.io/${{ github.repository_owner }}/docker-socket-proxy:latest
        run: |
          set -eu
          if docker manifest inspect ghcr.io/tecnativa/docker-socket-proxy:master >/dev/null 2>&1; then
            source=ghcr.io/tecnativa/docker-socket-proxy:master
          else
            source=ghcr.io/tecnativa/docker-socket-proxy:latest
          fi
          docker pull "$source"
          docker tag "$source" "$TARGET"
          docker push "$TARGET"
